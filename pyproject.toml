[tool.poetry]
name = "socialsim4"
version = "0.1.0"
description = "SocialSim4 core simulation engine and web backend"
authors = ["SocialSim4 Team <dev@socialsim4.local>"]
packages = [{ include = "socialsim4", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
litestar = "^2.8.3"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0.23"
psycopg = { extras = ["binary"], version = "^3.1.18" }
alembic = "^1.13.1"
bcrypt = "^5.0.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
pydantic = "^2.4.2"
pydantic-settings = "^2.1.0"
httpx = "^0.27.0"
email-validator = "^2.1.0"
aiosqlite = "^0.20.0"
openai = "^1.58.1"
google-generativeai = "^0.7.2"
duckduckgo-search = "^7.3.2"
trafilatura = "^1.12.2"
pypdf = "^4.0.0"
python-docx = "^1.1.0"
sentence-transformers = "^2.2.0"
chromadb = { version = ">=0.4.0", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
ruff = "^0.1.6"
mypy = "^1.6.0"

[tool.poetry.scripts]
socialsim4 = "socialsim4.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = "src"
markers = [
    "real_llm: tests that call a real configured LLM provider; require SOCIALSIM_TEST_REAL_LLM=1",
]

# Coverage exclusions — reviewed 2026-05-13
# council_scene.py: DEPRECATED — replaced by CouncilExperimentScene
#   (commit 52b6d12 adds explicit deprecation warning)
# landlord_scene.py + landlord_actions.py: not in active use
# werewolf_scene.py + werewolf_actions.py: not in current test scope
# village_scene.py + village_actions.py: not in current test scope
# prompt_builders/pgg.py + __init__.py: DEAD CODE — superseded by
#   generic prompt_builder.py, no active imports in execution path
[tool.coverage.run]
omit = [
    "src/socialsim4/core/scenes/council_scene.py",
    "src/socialsim4/core/scenes/landlord_scene.py",
    "src/socialsim4/core/scenes/werewolf_scene.py",
    "src/socialsim4/core/scenes/village_scene.py",
    "src/socialsim4/core/actions/landlord_actions.py",
    "src/socialsim4/core/actions/werewolf_actions.py",
    "src/socialsim4/core/actions/village_actions.py",
    "src/socialsim4/core/experiment/prompt_builders/pgg.py",
    "src/socialsim4/core/experiment/prompt_builders/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "warnings.warn.*deprecated",
]

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"
